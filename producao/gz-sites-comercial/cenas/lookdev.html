<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head>
<body>
<canvas id="c" width="540" height="960"></canvas>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const W = 540, H = 960;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;

function makeStudioEnv() {
  const w = 1024, h = 512;
  const data = new Float32Array(w * h * 4);
  for (let y = 0; y < h; y++) {
    const v = 1 - y / (h - 1);
    const lat = (v - 0.5) * Math.PI;
    for (let x = 0; x < w; x++) {
      const u = x / (w - 1);
      const lon = (u - 0.5) * Math.PI * 2;
      const dir = new THREE.Vector3(
        Math.cos(lat) * Math.sin(lon),
        Math.sin(lat),
        Math.cos(lat) * Math.cos(lon)
      );
      // dark graphite room
      let r = 0.012, g = 0.011, b = 0.010;
      // horizon lift
      const horizon = Math.exp(-Math.pow(dir.y * 3.2, 2));
      r += horizon * 0.045; g += horizon * 0.040; b += horizon * 0.032;
      // huge key softbox, upper camera-left (dir roughly -x, +y, +z)
      const key = smoothRect(dir, new THREE.Vector3(-0.55, 0.72, 0.45).normalize(), 0.55, 0.38);
      r += key * 7.5; g += key * 7.2; b += key * 6.6;
      // cooler rim, right-back
      const rim = smoothRect(dir, new THREE.Vector3(0.75, 0.35, -0.55).normalize(), 0.16, 0.70);
      r += rim * 2.2; g += rim * 2.5; b += rim * 3.4;
      // warm practical low
      const prac = smoothRect(dir, new THREE.Vector3(-0.2, -0.15, 0.9).normalize(), 0.28, 0.12);
      r += prac * 0.55; g += prac * 0.32; b += prac * 0.14;
      // floor bounce
      if (dir.y < 0) {
        const f = Math.min(1, -dir.y * 1.4);
        r += f * 0.03; g += f * 0.028; b += f * 0.024;
      }
      const i = (y * w + x) * 4;
      data[i] = r; data[i+1] = g; data[i+2] = b; data[i+3] = 1;
    }
  }
  const tex = new THREE.DataTexture(data, w, h, THREE.RGBAFormat, THREE.FloatType);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.needsUpdate = true;
  tex.colorSpace = THREE.LinearSRGBColorSpace;
  return tex;
}
function smoothRect(dir, axis, hx, hy) {
  // project dir onto plane of axis, measure ellipse
  const d = dir.clone().normalize();
  const dot = Math.max(-1, Math.min(1, d.dot(axis)));
  if (dot < 0.2) return 0;
  // build tangent basis
  const up = Math.abs(axis.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
  const tx = new THREE.Vector3().crossVectors(up, axis).normalize();
  const ty = new THREE.Vector3().crossVectors(axis, tx).normalize();
  const x = d.dot(tx);
  const y = d.dot(ty);
  const e = Math.sqrt((x / hx) ** 2 + (y / hy) ** 2);
  return Math.exp(-e * e * 3.2) * smoothstep(0.15, 0.85, dot);
}
function smoothstep(a, b, x) {
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

const envTex = makeStudioEnv();
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envMap = pmrem.fromEquirectangular(envTex).texture;

const scene = new THREE.Scene();
scene.environment = envMap;
scene.background = new THREE.Color(0x100f0d);

const cam = new THREE.PerspectiveCamera(28, W / H, 0.02, 30);
cam.position.set(-0.02, 0.22, 0.42);
cam.lookAt(0.02, 0.16, 0);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(4, 80),
  new THREE.MeshPhysicalMaterial({ color: 0x161513, metalness: 0.25, roughness: 0.32, envMapIntensity: 0.6 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const ball = new THREE.Mesh(
  new THREE.SphereGeometry(0.033, 96, 64),
  new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1, roughness: 0.07, envMapIntensity: 1.25, clearcoat: 0.15, clearcoatRoughness: 0.2 })
);
ball.position.set(-0.09, 0.18, 0.02);
scene.add(ball);

function wineGlass() {
  const pts = [];
  const y0 = 0.145;
  for (let i = 0; i <= 28; i++) {
    const t = i / 28;
    const ang = t * 2.45;
    const rOut = 0.006 + 0.046 * Math.sin(ang);
    const y = y0 + (1 - Math.cos(ang)) * 0.028 + t * 0.012;
    pts.push(new THREE.Vector2(Math.max(0.001, rOut), y));
  }
  // inner wall back down
  for (let i = 28; i >= 0; i--) {
    const t = i / 28;
    const ang = t * 2.45;
    const rOut = 0.006 + 0.046 * Math.sin(ang);
    const rIn = Math.max(0.0015, rOut - 0.0024);
    const y = y0 + (1 - Math.cos(ang)) * 0.028 + t * 0.012;
    pts.push(new THREE.Vector2(rIn, y));
  }
  const geo = new THREE.LatheGeometry(pts, 72);
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    metalness: 0,
    roughness: 0.025,
    transmission: 1,
    thickness: 0.008,
    ior: 1.52,
    attenuationColor: new THREE.Color(0xf4f7f6),
    attenuationDistance: 0.8,
    envMapIntensity: 1.1,
    clearcoat: 1,
    clearcoatRoughness: 0.04,
    specularIntensity: 1,
  });
  return new THREE.Mesh(geo, mat);
}
const glass = wineGlass();
glass.position.set(0.10, 0, 0);
scene.add(glass);
const stem = new THREE.Mesh(
  new THREE.CylinderGeometry(0.0042, 0.0046, 0.12, 16),
  glass.material
);
stem.position.set(0.10, 0.085, 0);
scene.add(stem);
const base = new THREE.Mesh(
  new THREE.CylinderGeometry(0.042, 0.044, 0.006, 32),
  glass.material
);
base.position.set(0.10, 0.022, 0);
scene.add(base);

const key = new THREE.DirectionalLight(0xfff6ec, 2.4);
key.position.set(-2.5, 4.0, 2.2);
scene.add(key);
const rimL = new THREE.DirectionalLight(0xd9e6ff, 1.6);
rimL.position.set(2.2, 1.4, -2.4);
scene.add(rimL);
scene.add(new THREE.AmbientLight(0xffffff, 0.08));

renderer.render(scene, cam);
window.__ready = true;
window.renderAgain = () => { renderer.render(scene, cam); return true; };
</script>
</body>
</html>
