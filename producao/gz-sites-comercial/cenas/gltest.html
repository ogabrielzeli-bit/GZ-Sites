<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1080, 1920, false);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141311);
const cam = new THREE.PerspectiveCamera(32, 1080/1920, 0.05, 20);
cam.position.set(0.15, 0.28, 0.55);
cam.lookAt(0, 0.12, 0);
const env = new THREE.Scene();
const cyc = new THREE.Mesh(new THREE.SphereGeometry(6, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: { A:{value:new THREE.Color(0x0c0b0a)}, B:{value:new THREE.Color(0x2a241c)} },
  vertexShader: `varying vec3 v; void main(){ v=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader: `varying vec3 v; uniform vec3 A,B; void main(){ float h=smoothstep(-1.2,2.2,v.y); gl_FragColor=vec4(mix(B,A,h),1.0);} `
}));
env.add(cyc);
const box = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.7), new THREE.MeshBasicMaterial({ color: 0xffffff }));
box.position.set(-1.2, 1.6, -0.4);
box.lookAt(0, 0.2, 0);
env.add(box);
const rim = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 1.2), new THREE.MeshBasicMaterial({ color: 0xdde7ff }));
rim.position.set(1.4, 0.8, -1.2);
rim.lookAt(0, 0.2, 0);
env.add(rim);
const pmrem = new THREE.PMREMGenerator(renderer);
const tex = pmrem.fromScene(env, 0.04).texture;
scene.environment = tex;
const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 64), new THREE.MeshPhysicalMaterial({ color: 0x1a1816, metalness: 0.2, roughness: 0.38 }));
floor.rotation.x = -Math.PI/2;
scene.add(floor);
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.033, 64, 32), new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1, roughness: 0.08, envMapIntensity: 1.2 }));
ball.position.set(-0.08, 0.16, 0);
scene.add(ball);
const glass = new THREE.Mesh(new THREE.SphereGeometry(0.055, 64, 32), new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0, roughness: 0.03, transmission: 1, thickness: 0.01, ior: 1.5,
  attenuationColor: new THREE.Color(0xe7f3f1), attenuationDistance: 0.5, envMapIntensity: 1
}));
glass.position.set(0.12, 0.14, 0);
scene.add(glass);
scene.add(new THREE.AmbientLight(0xffffff, 0.15));
const key = new THREE.DirectionalLight(0xfff4e8, 3.2);
key.position.set(-2, 3, 2);
scene.add(key);
renderer.render(scene, cam);
window.__ready = true;
window.__gl = renderer.getContext().getParameter(renderer.getContext().VERSION);
</script>
</body>
</html>
